<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact White Water Rafting Company - Penkwase High Tension, Sunyani, Bono Region. Get in touch for general inquiries, reservations, and suggestions.">
    <meta name="author" content="Bryce Mesumekyere">
    <title>Contact Us - White Water Rafting Company</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <img src="images/z-raftingcompas.jpg" alt="White Water Rafting Company logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <h1>White Water Rafting Company</h1>
        <div class="company-info">
        <p>Penkwase High Tension<br>Sunyani, Bono Region<br>+233531234567<br>info@byupathway.edu</p>
        </div>
        
        <div class="contact-grid">
            <div class="map-container">
                <iframe class="contact-map" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7914.252106719606!2d-2.3235952703953138!3d7.3397384314586!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xfdacf5002e15025%3A0x4ef2c78858503dcb!2sThe%20Church%20of%20Jesus%20Christ%20of%20Latter-day%20Saints!5e0!3m2!1sen!2sgh!4v1791513220780!5m2!1sen!2sgh" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        
            <form class="contact-form">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Placeholder">
                
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Placeholder">
      
                <p>Message Purpose</p>
                <label><input type="radio" name="purpose" value="general"> General Inquiry</label>
                <label><input type="radio" name="purpose" value="reservation"> Reservation Question</label>
                <label><input type="radio" name="purpose" value="suggestion"> Website Suggestion</label>

                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Type here"></textarea>
                
                <label><input type="checkbox" name="subscribe"> Please Subscribe me to the monthly newsletter</label>
                <button type="submit">Get in Touch!</button>
            </form>
        </div>

        <section class="employees">
            <h2>We Are Here To Serve You</h2>
            <div class="employee-row">
                <figure>
                    <img src="images/employee_1.jpg" alt="Happy Employee - Tour Guide">
                    <figcaption>Nana Ama - Lead Tour Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee_2.jpg" alt="Happy Employee - Manager">
                    <figcaption>Nana Yaa - Operation Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/employee_3.jpeg" alt="Happy Employee - Safety Officer">
                    <figcaption>Nana Abena - Safety Officer</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>©2026 White Water Rafting Company | Bryce Mesumekyere</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.png" alt="Facebook logo"></a>
            <a href="https://instagram.com"><img src="images/instagram.png" alt="Instagram logo"></a>
            <a href="https://linkedin.com"><img src="images/linkedin.png" alt="Linkedin logo"></a>
        </nav>
    </footer>
</body>
</html>
